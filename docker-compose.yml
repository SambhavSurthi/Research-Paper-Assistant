services:
  neo4j:
    image: neo4j:5.26-community
    container_name: ai-research-paper-assistant-neo4j
    restart: unless-stopped
    ports:
      - "7476:7474"   # Neo4j Browser UI (Knowledge Base Platform)
      - "7689:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-ai_research_paper_assistant_pass}"
      # Host port 7687 belongs to another Neo4j. Browser reads these advertised
      # addresses from discovery; without them it connects to the wrong instance
      # and fails with Neo.ClientError.Security.Unauthorized.
      NEO4J_server_bolt_advertised__address: localhost:7689
      NEO4J_server_http_advertised__address: localhost:7476
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  assistant:
    build: .
    container_name: ai-research-paper-assistant-app
    profiles: ["full"]
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      NEO4J_HTTP_URL: http://neo4j:7474
      NEO4J_URI: bolt://neo4j:7687

volumes:
  neo4j_data:
  neo4j_logs:
